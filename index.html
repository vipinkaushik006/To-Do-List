<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A smart, modern To-Do List app with priorities, due dates, categories, and dark mode.">
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-wrapper">

    <!-- Header -->
    <header class="app-header" role="banner">
      <div class="header-left">
        <span class="app-logo" aria-hidden="true">✅</span>
        <h1 class="app-title">My To-Do List</h1>
      </div>
      <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark/light mode">
        🌙 Dark
      </button>
    </header>

    <!-- Stats -->
    <section class="stats-bar" aria-label="Task statistics">
      <div class="stat-card" role="status" aria-label="Total tasks">
        <div class="stat-number" id="statTotal">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-card" role="status" aria-label="Completed tasks">
        <div class="stat-number" id="statDone">0</div>
        <div class="stat-label">Done</div>
      </div>
      <div class="stat-card" role="status" aria-label="Pending tasks">
        <div class="stat-number" id="statPending">0</div>
        <div class="stat-label">Pending</div>
      </div>
    </section>

    <!-- Add Task -->
    <section class="add-task-card" aria-label="Add new task">
      <div class="add-task-row">
        <input
          type="text"
          id="taskInput"
          class="task-input"
          placeholder="What needs to be done?"
          aria-label="New task description"
          maxlength="200"
        >
        <button class="btn-add" onclick="addTask()" aria-label="Add task">+ Add</button>
      </div>
      <div class="add-task-options">
        <select id="priorityInput" class="form-select" aria-label="Task priority">
          <option value="low">🟢 Low</option>
          <option value="medium" selected>🟡 Medium</option>
          <option value="high">🔴 High</option>
        </select>
        <input
          type="text"
          id="categoryInput"
          class="form-select"
          placeholder="Category (optional)"
          aria-label="Task category"
          maxlength="30"
        >
        <input
          type="date"
          id="dueDateInput"
          class="form-input-date"
          aria-label="Due date"
        >
      </div>
    </section>

    <!-- Search & Filter -->
    <section class="filter-card" aria-label="Search and filter tasks">
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="🔍 Search tasks or categories…"
        aria-label="Search tasks"
      >
      <select id="filterStatus" class="filter-select" aria-label="Filter by status">
        <option value="all">All Tasks</option>
        <option value="pending">Pending</option>
        <option value="completed">Completed</option>
      </select>
      <select id="filterPriority" class="filter-select" aria-label="Filter by priority">
        <option value="all">All Priorities</option>
        <option value="high">🔴 High</option>
        <option value="medium">🟡 Medium</option>
        <option value="low">🟢 Low</option>
      </select>
    </section>

    <!-- Bulk Actions -->
    <div class="bulk-actions" role="group" aria-label="Bulk task actions">
      <button class="btn-bulk" onclick="markAllComplete()" aria-label="Mark all tasks as complete">✅ Mark All Complete</button>
      <button class="btn-bulk danger" onclick="clearCompleted()" aria-label="Clear all completed tasks">🗑️ Clear Completed</button>
    </div>

    <!-- Task List -->
    <main>
      <ul id="taskList" class="task-list" role="list" aria-label="Task list" aria-live="polite"></ul>
    </main>

  </div>

  <!-- Edit Modal -->
  <div id="modalOverlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h2 class="modal-title" id="modalTitle">Edit Task</h2>
      <div class="modal-field">
        <label class="modal-label" for="editText">Task</label>
        <input type="text" id="editText" class="modal-input" maxlength="200" aria-required="true">
      </div>
      <div class="modal-field">
        <label class="modal-label" for="editPriority">Priority</label>
        <select id="editPriority" class="modal-select">
          <option value="low">🟢 Low</option>
          <option value="medium">🟡 Medium</option>
          <option value="high">🔴 High</option>
        </select>
      </div>
      <div class="modal-field">
        <label class="modal-label" for="editCategory">Category</label>
        <input type="text" id="editCategory" class="modal-input" maxlength="30" placeholder="Category (optional)">
      </div>
      <div class="modal-field">
        <label class="modal-label" for="editDueDate">Due Date</label>
        <input type="date" id="editDueDate" class="modal-date">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save" onclick="saveEdit()">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="false"></div>

  <script src="script.js"></script>
</body>
</html>
